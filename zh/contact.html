<head>

  <meta name="description" content="联系 Parodonto'Lagny 诊所，地址：46 Rue du Chemin de Fer, 77400 Lagny-sur-Marne。Rebecca Cohen 医生，牙周专科。可在 Doctolib 在线预约。">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=8">
  <meta name="theme-color" content="#9E7070">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="stylesheet" href="/src/styles/animations.css">
</head>
<body class="page-transition">
  <div id="header-placeholder"></div>

  <section class="page-hero">
    <div class="container">
      <div class="breadcrumbs">
        <a href="/zh/index.html">首页</a> <span>›</span> <span class="current">联系我们</span>
      </div>
      <h1>联系我们</h1>
      <p>如有任何疑问或需要预约，欢迎随时与我们联系。</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="contact-grid fade-in">
        <div>
          <span class="section-label">给我们留言</span>
          <h2 style="margin-bottom: var(--space-xl);">联系表单</h2>
          <form class="contact-form" id="contact-form" onsubmit="handleSubmit(event)">
            <div class="form-group">
              <label for="name">姓名 *</label>
              <input type="text" id="name" name="name" required placeholder="您的姓名">
            </div>
            <div class="form-group">
              <label for="email">电子邮箱 *</label>
              <input type="email" id="email" name="email" required placeholder="you@email.com">
            </div>
            <div class="form-group">
              <label for="phone">电话</label>
              <input type="tel" id="phone" name="phone" placeholder="06 XX XX XX XX">
            </div>
            <div class="form-group">
              <label for="subject">主题 *</label>
              <select id="subject" name="subject" required>
                <option value="">— 请选择 —</option>
                <option value="预约就诊">预约就诊</option>
                <option value="咨询信息">咨询信息</option>
                <option value="转诊医生">转诊医生</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <div class="form-group">
              <label for="message">留言 *</label>
              <textarea id="message" name="message" required placeholder="请描述您的需求……"></textarea>
            </div>
            <button type="submit" class="btn btn--primary btn--lg" id="submit-btn">发送留言 →</button>
            <div id="form-status" style="margin-top: var(--space-md); display: none;"></div>
          </form>
        </div>

        <div>
          <span class="section-label">联系方式</span>
          <h2 style="margin-bottom: var(--space-xl);">找到我们</h2>

          <div class="card" style="margin-bottom: var(--space-xl);">
            <h3 style="margin-bottom: var(--space-md);">📍 Parodonto'Lagny 诊所</h3>
            <p style="color: var(--color-text-light);">
              46 Rue du Chemin de Fer<br>
              77400 Lagny-sur-Marne，法国
            </p>
            <p style="color: var(--color-text-muted); font-size: 0.9rem; margin-top: var(--space-sm);">
              一楼，无障碍通道入口
            </p>
          </div>

          <div class="card" style="margin-bottom: var(--space-xl);">
            <h3 style="margin-bottom: var(--space-md);">🚆 交通</h3>
            <p style="color: var(--color-text-light); font-size: 0.95rem;">
              <strong>市郊铁路 RER：</strong>Lagny-Thorigny 站（P 线）<br>
              <strong>公交：</strong>Delambre 站（23 路）/ Verdun 站（29、25、42 路）<br>
              <strong>停车场：</strong>3 bis rue Delambre
            </p>
          </div>

          <a href="https://www.doctolib.fr/dentiste/lagny-sur-marne/rebecca-cohen-77400-lagny-sur-marne/booking/motives?specialityId=1&telehealth=false&placeId=practice-268019&motiveCategoryIds%5B%5D=222400&profile_skipped=false&source=profile" target="_blank" rel="noopener" class="btn btn--accent btn--lg" style="width: 100%; justify-content: center;">
            📅 在 Doctolib 上预约
          </a>

          <div style="margin-top: var(--space-xl); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-md);">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2627.5!2d2.7117!3d48.8747!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2s46+Rue+du+Chemin+de+Fer+77400+Lagny-sur-Marne!5e0!3m2!1szh-CN!2sfr!4v1"
              width="100%" height="250"
              style="border:0;" allowfullscreen="" loading="lazy">
            </iframe>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script type="module">
    import { initLayout } from '/src/js/layout.js';
    import { initSEO } from '/src/js/seo.js';
    initLayout('contact');
    initSEO({
      path: '/zh/contact.html',
      title: "联系我们 | Parodonto'Lagny | Rebecca Cohen 医生，Lagny-sur-Marne",
      description: "联系 Parodonto'Lagny 诊所。Rebecca Cohen 医生，46 Rue du Chemin de Fer, 77400 Lagny-sur-Marne。可在 Doctolib 或通过表单预约。",
      breadcrumbs: [
        { name: '首页', url: '/zh/index.html' },
        { name: '联系我们', url: '/zh/contact.html' }
      ],
      hreflangs: { fr: '/contact.html', en: '/en/contact.html', zh: '/zh/contact.html' }
    });
  </script>

  <script>
    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const status = document.getElementById('form-status');

      btn.disabled = true;
      btn.textContent = '发送中……';

      const formData = new FormData();
      formData.append('access_key', 'e404fe84-ac29-465d-9246-263ebe9e562d');
      formData.append('subject', "[Parodonto'Lagny — ZH] " + document.getElementById('subject').value);
      formData.append('from_name', document.getElementById('name').value);
      formData.append('name', document.getElementById('name').value);
      formData.append('email', document.getElementById('email').value);
      formData.append('phone', document.getElementById('phone').value || '未填写');
      formData.append('message', document.getElementById('message').value);

      try {
        const res = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();

        if (data.success) {
          status.style.display = 'block';
          status.innerHTML = '<div class="glass-card" style="background: #dcfce7; border-color: #86efac;"><p style="color: #166534; margin: 0;"><strong>留言发送成功！</strong><br>我们会尽快回复您。</p></div>';
          document.getElementById('contact-form').reset();
        } else {
          throw new Error(data.message || 'Error');
        }
      } catch (err) {
        status.style.display = 'block';
        status.innerHTML = '<div class="glass-card" style="background: #fee2e2; border-color: #fca5a5;"><p style="color: #991b1b; margin: 0;"><strong>发送失败。</strong><br>请重试，或直接发送邮件至 dentiste_lagny@hotmail.com</p></div>';
      }

      btn.disabled = false;
      btn.textContent = '发送留言 →';
    }
  </script>
</body>
</html>
