  <section class="section">
    <div class="container">
      <div class="quiz-container glass-card" id="quiz-container">
        <div class="quiz-progress">
          <div class="quiz-progress-bar" id="progress-bar" style="width: 0%"></div>

        <!-- INTRO -->
        <div class="quiz-step active" id="step-intro">
          <div style="text-align: center; padding: var(--space-xl) 0;">
            <div style="font-size: 3rem; margin-bottom: var(--space-lg);" class="heartbeat">🩺</div>
            <h2 style="margin-bottom: var(--space-md);">测测您的牙周健康</h2>

              这份自测问卷可帮助您识别牙周疾病可能出现的迹象。它不能替代专业诊断，但有助于让您意识到及时就诊的重要性。
            </p>
            <p style="font-size: 0.85rem; color: var(--color-text-muted); margin-bottom: var(--space-2xl);">
              ⏱️ 预计用时：2 分钟 • 16 道问题 • 即时出结果
            </p>
            <button class="btn btn--primary btn--lg" onclick="startQuiz()">开始自测 →</button>

        <!-- QUESTIONS (generated by JS) -->

        <!-- RESULTS -->

      </div>

      <p style="text-align: center; font-size: 0.78rem; color: var(--color-text-muted); max-width: 620px; margin: var(--space-xl) auto 0; line-height: 1.7;">
        本参考问卷参考了欧洲牙周病学联合会（<a href="https://www.efp.org/for-patients/assess-your-gum-health/check-your-gum-health/" target="_blank" rel="noopener" style="color: var(--color-text-light); text-decoration: underline;">European Federation of Periodontology, EFP</a>）提供的 “Check your gum health” 自测，并由本诊所改编。
      </p>

  <div id="cta-placeholder" data-type="rdv"></div>
  <div id="footer-placeholder"></div>

  <script type="module">
    import { initLayout } from '/src/js/layout.js';
    import { initSEO } from '/src/js/seo.js';
    initLayout('autodiagnostic');
    initSEO({
      path: '/zh/autodiagnostic.html',
      title: "免费牙周自测 | 评估您的风险 | Parodonto'Lagny",
      description: "通过我们的免费问卷，2 分钟评估您的牙周疾病风险。16 道简单问题，即时出结果。Parodonto'Lagny 诊所，Lagny-sur-Marne。",
      breadcrumbs: [
        { name: '首页', url: '/zh/index.html' },
        { name: '牙周自测', url: '/zh/autodiagnostic.html' }
      ],
      hreflangs: { fr: '/autodiagnostic.html', en: '/en/autodiagnostic.html', zh: '/zh/autodiagnostic.html' }
    });
  </script>

  <script>
    // Quiz Data
    const questions = [
      {
        question: "您的性别是？",
        options: [
          { text: "男性", score: 1 },
          { text: "女性", score: 0 }
        ]
      },
      {
        question: "您的年龄是？",
        options: [
          { text: "30 岁以下", score: 0 },
          { text: "30 至 45 岁", score: 1 },
          { text: "45 至 60 岁", score: 2 },
          { text: "60 岁以上", score: 3 }
        ]
      },
      {
        question: "您如何描述自己的体型？",
        options: [
          { text: "体重正常", score: 0 },
          { text: "略微超重", score: 1 },
          { text: "明显超重或肥胖", score: 2 }
        ]
      },
      {
        question: "您现在吸烟或曾经吸烟吗？",
        options: [
          { text: "不，从不吸烟", score: 0 },
          { text: "已戒烟 5 年以上", score: 1 },
          { text: "最近戒烟（不足 5 年）", score: 2 },
          { text: "是，目前吸烟", score: 3 }
        ]
      },
      {
        question: "您是否患有以下疾病之一？",
        options: [
          { text: "都没有", score: 0 },
          { text: "糖尿病", score: 2 },
          { text: "心血管疾病", score: 1 },
          { text: "免疫功能缺陷", score: 2 }
        ]
      },
      {
        question: "您是否有口干的感觉，或正在服用抗焦虑药物？",
        options: [
          { text: "从不", score: 0 },
          { text: "偶尔", score: 1 },
          { text: "经常", score: 2 }
        ]
      },
      {
        question: "刷牙时您的牙龈会出血吗？",
        options: [
          { text: "很少或从不", score: 0 },
          { text: "有时", score: 1 },
          { text: "经常，或每次刷牙都出血", score: 3 }
        ]
      },
      {
        question: "您觉得自己的牙龈红肿或敏感吗？",
        options: [
          { text: "不，牙龈呈粉红色且坚实", score: 0 },
          { text: "有时有点发红或肿胀", score: 2 },
          { text: "是，经常红肿或疼痛", score: 3 }
        ]
      },
      {
        question: "您有未治疗的蛀牙吗？",
        options: [
          { text: "没有", score: 0 },
          { text: "有，一两颗", score: 1 },
          { text: "有，好几颗", score: 2 }
        ]
      },
      {
        question: "您是否感觉牙齿在松动？",
        options: [
          { text: "完全没有", score: 0 },
          { text: "轻微，一两颗牙", score: 2 },
          { text: "是，好几颗牙明显松动", score: 3 }
        ]
      },
      {
        question: "您的种植牙在刷牙时是否疼痛或出血？",
        options: [
          { text: "我没有种植牙", score: 0 },
          { text: "没有，种植牙没有不适", score: 0 },
          { text: "是，有时疼痛或出血", score: 3 }
        ]
      },
      {
        question: "您是否有持续性口臭？",
        options: [
          { text: "很少或从不", score: 0 },
          { text: "偶尔", score: 1 },
          { text: "经常", score: 2 }
        ]
      },
      {
        question: "您是否注意到牙齿的位置发生了变化？",
        options: [
          { text: "没有", score: 0 },
          { text: "是，轻微变化", score: 2 },
          { text: "是，明显变化（出现缝隙）", score: 3 }
        ]
      },
      {
        question: "您的家人是否有过早（60 岁前）失牙的情况？",
        options: [
          { text: "没有，据我所知没有", score: 0 },
          { text: "有，父母或祖父母", score: 2 }
        ]
      },
      {
        question: "您是否感觉牙龈在退缩（牙齿看起来变长了）？",
        options: [
          { text: "没有", score: 0 },
          { text: "是，几颗牙", score: 2 },
          { text: "是，好几颗牙明显退缩", score: 3 }
        ]
      },
      {
        question: "食物是否经常塞在您的牙缝里？",
        options: [
          { text: "很少或从不", score: 0 },
          { text: "偶尔", score: 1 },
          { text: "几乎每餐都会", score: 2 }
        ]
      }
    ];

    let currentStep = 0;
    let totalScore = 0;
    let answers = [];
    let selectedOptionIdx = [];

    const SHARE_URL = 'https://dentiste-parodontologie-lagny.fr/zh/autodiagnostic.html';
    const SHARE_TEXT = '花 2 分钟做个免费的牙龈自测：' + SHARE_URL;

    function startQuiz() {
      document.getElementById('step-intro').classList.remove('active');
      buildQuestions();
      showStep(0);
      document.getElementById('quiz-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function buildQuestions() {
      const container = document.getElementById('quiz-questions');
      const isLast = (i) => i === questions.length - 1;

      questions.forEach((q, i) => {
        const step = document.createElement('div');
        step.className = 'quiz-step';
        step.id = `step-${i}`;
        step.innerHTML = `
          <div class="quiz-question">${q.question}</div>
          <div class="quiz-options">
            ${q.options.map((opt, j) => `
              <label class="quiz-option" data-question="${i}" data-score="${opt.score}" data-index="${j}">
                <input type="radio" name="q${i}" value="${opt.score}">
                <span class="quiz-radio"></span>
                <span>${opt.text}</span>
              </label>
            `).join('')}
          </div>
          <div class="quiz-nav">
            ${i > 0 ? `<button class="btn btn--outline" onclick="prevStep()">← 上一题</button>` : '<span></span>'}
            <span class="quiz-step-indicator">第 ${i + 1} 题 / 共 ${questions.length} 题</span>
            ${isLast(i) ? `<button class="btn btn--primary" id="next-${i}" onclick="showResults()" disabled>查看结果</button>` : '<span></span>'}
          </div>
        `;
        container.appendChild(step);
      });

      // Click handler : select + auto-advance
      document.querySelectorAll('.quiz-option').forEach(opt => {
        opt.addEventListener('click', function(e) {
          // <label> 会激活隐藏的 <input>，从而合成一次冒泡点击，导致本处理函数
          // 被触发两次（跳过一题）。preventDefault 阻止 input 的默认激活。
          e.preventDefault();

          const parentStep = this.closest('.quiz-step');
          if (!parentStep || !parentStep.classList.contains('active')) return;

          const qIdx = parseInt(this.dataset.question);
          const score = parseInt(this.dataset.score);

          // Deselect siblings
          this.parentElement.querySelectorAll('.quiz-option').forEach(o => o.classList.remove('selected'));
          this.classList.add('selected');
          this.querySelector('input').checked = true;

          answers[qIdx] = score;
          selectedOptionIdx[qIdx] = parseInt(this.dataset.index);

          // Last question: enable results button
          if (qIdx === questions.length - 1) {
            document.getElementById(`next-${qIdx}`).disabled = false;
            return;
          }

          // 短暂延迟后自动前进 —— 每一步仅安排一次（防止各设备上的重复触发）
          if (parentStep.dataset.advancing === '1') return;
          parentStep.dataset.advancing = '1';
          setTimeout(() => {
            nextStep();
            document.getElementById('quiz-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 400);
        });
      });
    }

    function showStep(idx) {
      if (idx >= questions.length) {
        showResults();
        return;
      }
      if (idx < 0) idx = 0;
      document.querySelectorAll('.quiz-step').forEach(s => s.classList.remove('active'));
      const step = document.getElementById(`step-${idx}`);
      if (step) {
        step.classList.add('active');
        currentStep = idx;
        updateProgress();
      }
    }

    function nextStep() {
      showStep(currentStep + 1);
    }

    function prevStep() {
      showStep(currentStep - 1);
    }

    function updateProgress() {
      const pct = ((currentStep + 1) / questions.length) * 100;
      document.getElementById('progress-bar').style.width = pct + '%';
    }

    function showResults() {
      totalScore = answers.reduce((sum, val) => sum + (val || 0), 0);

      document.querySelectorAll('.quiz-step').forEach(s => s.classList.remove('active'));
      document.getElementById('step-result').classList.add('active');
      document.getElementById('progress-bar').style.width = '100%';

      let level, icon, text, className;

      if (totalScore <= 8) {
        level = "风险较低";
        icon = "✅";
        className = "low";
        text = `好消息！根据您的回答，您患牙周疾病的风险似乎较低，这很令人欣慰！但您知道吗？牙周疾病影响着近半数的成年人，而且往往在没有任何明显症状的情况下悄悄发展。本自测旨在提高您的健康意识：即使没有明显迹象，定期进行牙周检查仍是及早发现问题的最佳方式——在问题还容易处理的阶段就将其解决。请不要等到出现症状才采取行动。`;
      } else if (totalScore <= 18) {
        level = "风险中等";
        icon = "⚠️";
        className = "moderate";
        text = `您的回答显示您患牙周疾病的风险为中等。某些因素或症状值得特别关注。我们建议您咨询牙周专科医生，进行全面检查以排除潜在问题。越早处理，治疗就越简单、越有效。`;
      } else {
        level = "风险较高";
        icon = "🔴";
        className = "high";
        text = `您的回答提示您患牙周疾病的风险较高，已出现多个警示信号。强烈建议您尽快就诊牙周专科医生，以获得准确的诊断和相应的治疗。疾病越早治疗，保住牙齿的机会就越大。`;
      }

      const doctolibUrl = 'https://www.doctolib.fr/dentiste/lagny-sur-marne/rebecca-cohen-77400-lagny-sur-marne/booking/motives?specialityId=1&telehealth=false&placeId=practice-268019&motiveCategoryIds%5B%5D=222400&profile_skipped=false&source=profile';
      const showRdvBtn = true;

      // 糖尿病 = 第 5 题（索引 4），选项索引 1
      const hasDiabete = selectedOptionIdx[4] === 1;

      document.getElementById('result-content').innerHTML = `
        ${hasDiabete ? `
        <div style="background: linear-gradient(135deg, #dbeafe, #eff6ff); border: 2px solid #3b82f6; border-radius: var(--radius-lg); padding: var(--space-xl); margin-bottom: var(--space-xl); text-align: center;">
          <p style="font-size: 2rem; margin-bottom: var(--space-sm);">🏥</p>
          <p style="font-weight: 800; color: #1e40af; font-size: 1.3rem; margin-bottom: var(--space-sm);">糖尿病患者？</p>
          <p style="font-weight: 700; color: #1e3a5f; font-size: 1.05rem; line-height: 1.8; margin: 0;">您的<strong style="color: #1e40af;">牙周检查和牙周治疗可由法国医保报销</strong>。<br>糖尿病患者更容易罹患牙周疾病，请不要拖延，及时就诊。</p>
        </div>
        ` : ''}
        <div class="result-icon ${className}" style="animation: fadeIn 0.6s ease;">${icon}</div>
        <div class="result-level ${className}">${level}</div>
        <p style="color: var(--color-text-muted); font-size: 0.9rem; margin-bottom: var(--space-md);">得分：${totalScore} / ${getMaxScore()}</p>
        <p class="result-text">${text}</p>
        ${showRdvBtn ? `
        <div style="background: var(--color-primary-subtle); border-radius: var(--radius-lg); padding: var(--space-xl); margin-bottom: var(--space-xl);">
          <p style="font-weight: 600; color: var(--color-primary-dark); margin-bottom: var(--space-md); font-size: 1.05rem;">${className === 'low' ? '通过预防性检查，守护您的牙齿健康' : '我们建议您预约就诊'}</p>
          <a href="${doctolibUrl}" target="_blank" rel="noopener" class="btn btn--accent btn--lg btn--pulse" style="width: 100%; justify-content: center;">📅 预约 Cohen 医生就诊</a>
        </div>
        ` : ''}
        <div style="display: flex; gap: var(--space-md); justify-content: center; flex-wrap: wrap; margin-bottom: var(--space-xl);">
          <button class="btn btn--outline" onclick="resetQuiz()">🔄 重新测试</button>
        </div>
        <div style="border-top: 1px solid var(--color-border); padding-top: var(--space-xl);">
          <p style="font-weight: 600; margin-bottom: var(--space-md); color: var(--color-text);">把这个自测分享给您身边的人</p>
          <div style="display: flex; gap: var(--space-sm); justify-content: center; flex-wrap: wrap;">
            <a href="https://wa.me/?text=${encodeURIComponent(SHARE_TEXT)}" target="_blank" rel="noopener" class="btn btn--outline" style="padding: 10px 20px; font-size: 0.85rem;">WhatsApp</a>
            <button class="btn btn--outline" style="padding: 10px 20px; font-size: 0.85rem;" onclick="shareSMS()">短信</button>
            <button class="btn btn--outline" style="padding: 10px 20px; font-size: 0.85rem;" onclick="copyLink()">复制链接</button>
          </div>
          <p id="copy-confirm" style="font-size: 0.8rem; color: var(--color-risk-low); margin-top: var(--space-sm); display: none;">链接已复制！</p>
        </div>
        <p style="font-size: 0.8rem; color: var(--color-text-muted); margin-top: var(--space-xl); font-style: italic;">
          本问卷仅为参考工具，不构成医学诊断。只有经合格专业人员进行的临床检查，才能作出可靠的诊断。请咨询 Rebecca Cohen 医生，进行个性化的牙周检查。
        </p>
      `;
    }

    function getMaxScore() {
      return questions.reduce((sum, q) => sum + Math.max(...q.options.map(o => o.score)), 0);
    }

    function shareSMS() {
      window.open('sms:?body=' + encodeURIComponent(SHARE_TEXT));
    }

    function copyLink() {
      navigator.clipboard.writeText(SHARE_URL).then(() => {
        const confirm = document.getElementById('copy-confirm');
        if (confirm) { confirm.style.display = 'block'; setTimeout(() => confirm.style.display = 'none', 2000); }
      });
    }

    function resetQuiz() {
      currentStep = 0;
      totalScore = 0;
      answers = [];
      selectedOptionIdx = [];
      document.getElementById('quiz-questions').innerHTML = '';
      document.querySelectorAll('.quiz-step').forEach(s => s.classList.remove('active'));
      document.getElementById('step-intro').classList.add('active');
      document.getElementById('progress-bar').style.width = '0%';
    }
  </script>
</body>
</html>
