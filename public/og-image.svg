<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3d3b"/>
      <stop offset="50%" stop-color="#1a5c5a"/>
      <stop offset="100%" stop-color="#2a8a87"/>
    </linearGradient>

    <!-- Subtle radial glow behind tooth icon -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold accent gradient -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4b35a"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>

    <!-- Bottom decorative line gradient -->
    <linearGradient id="line-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0"/>
      <stop offset="15%" stop-color="#c9a84c" stop-opacity="1"/>
      <stop offset="85%" stop-color="#c9a84c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern for texture -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="1200" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="1200" y2="530" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1000" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="1200" y2="260" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Large decorative tooth silhouette in background (right side) -->
  <g transform="translate(820, 80) scale(7)" opacity="0.04">
    <path d="M16 6c-2.5 0-4.5 1.2-5.5 3.5-.8 1.8-.5 4 .3 5.8.5 1.2 1.2 2.4 1.8 3.5.8 1.5 1.5 3 2 4.5.3.8.5 1.5.7 2.2.1.3.3.5.7.5s.6-.2.7-.5c.2-.7.4-1.4.7-2.2.5-1.5 1.2-3 2-4.5.6-1.1 1.3-2.3 1.8-3.5.8-1.8 1.1-4 .3-5.8C20.5 7.2 18.5 6 16 6z" fill="white"/>
  </g>

  <!-- Radial glow behind primary tooth icon -->
  <circle cx="148" cy="220" r="120" fill="url(#glow)"/>

  <!-- Primary tooth icon -->
  <g transform="translate(88, 140)">
    <!-- Tooth icon background circle -->
    <circle cx="60" cy="60" r="58" fill="none" stroke="white" stroke-width="1.5" opacity="0.2"/>
    <circle cx="60" cy="60" r="50" fill="none" stroke="white" stroke-width="1" opacity="0.1"/>

    <!-- Tooth shape (scaled up from favicon) -->
    <g transform="translate(24, 18) scale(2.25)">
      <path d="M16 6c-2.5 0-4.5 1.2-5.5 3.5-.8 1.8-.5 4 .3 5.8.5 1.2 1.2 2.4 1.8 3.5.8 1.5 1.5 3 2 4.5.3.8.5 1.5.7 2.2.1.3.3.5.7.5s.6-.2.7-.5c.2-.7.4-1.4.7-2.2.5-1.5 1.2-3 2-4.5.6-1.1 1.3-2.3 1.8-3.5.8-1.8 1.1-4 .3-5.8C20.5 7.2 18.5 6 16 6z" fill="white"/>
    </g>
  </g>

  <!-- Gold accent bar (left edge) -->
  <rect x="0" y="0" width="5" height="630" fill="url(#gold)"/>

  <!-- Main title: Parodonto'Lagny -->
  <text x="260" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="bold" fill="white" letter-spacing="1">
    <tspan>Parodonto</tspan><tspan fill="#c9a84c" font-size="80">'</tspan><tspan fill="white">Lagny</tspan>
  </text>

  <!-- Decorative line under title -->
  <rect x="260" y="255" width="200" height="3" rx="1.5" fill="#c9a84c"/>

  <!-- Subtitle -->
  <text x="260" y="310" font-family="'Helvetica Neue', Arial, sans-serif" font-size="32" fill="white" opacity="0.9" letter-spacing="3">
    Cabinet de Parodontologie
  </text>

  <!-- Small decorative dots -->
  <circle cx="260" cy="365" r="3" fill="#c9a84c" opacity="0.6"/>
  <circle cx="278" cy="365" r="3" fill="#c9a84c" opacity="0.4"/>
  <circle cx="296" cy="365" r="3" fill="#c9a84c" opacity="0.2"/>

  <!-- Bottom separator line -->
  <rect x="80" y="500" width="1040" height="1" fill="url(#line-grad)" opacity="0.3"/>

  <!-- Doctor info -->
  <text x="600" y="555" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="white" opacity="0.75" text-anchor="middle" letter-spacing="2">
    Dr. Rebecca Cohen
  </text>
  <text x="600" y="590" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="white" opacity="0.5" text-anchor="middle" letter-spacing="4">
    Lagny-sur-Marne (77)
  </text>

  <!-- Subtle corner accents -->
  <path d="M1170 30 L1170 10 L1190 10" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.3"/>
  <path d="M30 600 L10 600 L10 620" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.3"/>
</svg>